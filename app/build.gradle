plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
// Base URL do backend (contrato V1 §1). Vazia = modo DEV sem backend real.
def backendUrl = (localProps.getProperty('BACKEND_URL', '') ?: '').trim().replace('"', '')

android {
    namespace 'dev.assemble.app'
    compileSdk 36

    defaultConfig {
        // Base provisória (contrato): applicationId + minSdk 26.
        applicationId 'dev.assemble.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1-dev'
        buildConfigField 'String', 'BACKEND_URL', '"' + backendUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}
